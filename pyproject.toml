[project]
name = "chinchilla-llm-bench"
version = "0.1.0"
description = "Concurrency benchmark for vLLM servers with a live agent-swarm UI"
authors = [
    { name = "davidcastilloalvarado", email = "dcastilloa@uni.pe" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.54",
    "rich>=13.7",
]

[project.scripts]
chinchilla-bench = "chinchilla_llm_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
